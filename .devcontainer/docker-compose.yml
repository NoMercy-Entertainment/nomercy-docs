version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace
      - /workspace/node_modules
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
    command: npm run dev
    stdin_open: true
    tty: true
